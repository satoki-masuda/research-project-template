name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Install Python and dependencies
        run: uv sync --locked --dev
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest

  slides:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install slide dependencies
        run: npm ci
      - name: Build slides
        run: npm run slides:build
      - name: Upload generated slides
        uses: actions/upload-artifact@v6
        with:
          name: slides-${{ github.sha }}
          path: |
            slides/dist/slides.html
            slides/dist/slides.pdf
            slides/dist/slides.pptx
          retention-days: 30
          if-no-files-found: error
